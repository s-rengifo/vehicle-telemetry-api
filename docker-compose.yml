version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: telemetry_db
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: telemetry_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
